[package]
name = "zeno"
version = "0.9.0"
edition = "2021"
description = "Zeno: a small, readable, statically typed language that compiles to C"
license = "MIT"

[[bin]]
name = "zeno"
path = "src/main.rs"

[dependencies]

# A released `zeno` carries no table of names for a debugger, which
# makes the file about a seventh smaller.
[profile.release]
strip = true
# The compiler works on Zeno as one piece. With its usual sixteen
# pieces, what it puts next to what, and what it folds into what,
# changes whenever code is added anywhere, and `zeno run --vm` was 3 to
# 7 % slower in 0.5.0 than in 0.4.0 with not a line of the VM changed
# (decision 24.29).
codegen-units = 1
